name: Проверка изменений

# Запускается на каждом Pull Request: проверяет код сборки и собирает все книги,
# чтобы битая ссылка или ошибка в book.toml не попала в main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xtask:
    name: Код сборки (xtask)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Форматирование
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --package xtask --all-targets -- -D warnings

  books:
    name: Сборка книг и ссылки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Установка zip
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip
      - name: Кэш cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Метаданные cargo нужны, чтобы cargo install узнавал бинарники из кэша; v2 в ключе сбрасывает старый кэш без них.
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-books-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-books-v2-
      - name: Установка инструментов mdBook
        run: |
          cargo install --locked mdbook --version 0.5.4
          cargo install --locked mdbook-mermaid --version 0.17.1
          cargo install --locked mdbook-epub --version 0.5.4
          cargo install --locked mdbook-i18n-helpers --version 0.4.0
          cargo install --locked mdbook-svgbob --version 0.3.1
          cargo install --locked mdbook-tabs --version 1.0.4
          cargo install --locked mdbook-shiftinclude --version 0.2.0
          cargo install --path comprehensive-rust/mdbook-course
          cargo install --path comprehensive-rust/mdbook-exerciser
      - name: Сборка сайта
        run: cargo xtask build
      - name: Проверка внутренних ссылок
        run: python3 scripts/check_links.py site
