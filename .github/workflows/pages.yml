name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установка Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Установка zip
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip

      - name: Кэш cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-books-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-books-

      - name: Установка инструментов mdBook
        run: |
          cargo install --locked mdbook --version 0.5.4
          cargo install --locked mdbook-mermaid --version 0.17.1
          cargo install --locked mdbook-epub --version 0.5.4
          cargo install --locked mdbook-i18n-helpers --version 0.4.0
          cargo install --locked mdbook-svgbob --version 0.3.1
          cargo install --path comprehensive-rust/mdbook-course
          cargo install --path comprehensive-rust/mdbook-exerciser

      - name: Сборка сайта
        run: cargo xtask build

      - name: Проверка внутренних ссылок
        run: python3 scripts/check_links.py site

      - name: Загрузка артефакта
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Публикация на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
