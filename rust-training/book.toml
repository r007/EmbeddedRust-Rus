[book]
title = "Практический курс Rust"
authors = ["Tweede golf (оригинал)", "Сергей Монин (перевод)"]
language = "ru"
src = "src"

[build]
build-dir = "book"

[output.html]
git-repository-url = "https://github.com/r007/EmbeddedRust-Rus"
edit-url-template = "https://github.com/r007/EmbeddedRust-Rus/edit/main/rust-training/src/{path}"
default-theme = "light"
preferred-dark-theme = "ayu"

[output.html.playground]
editable = true
line-numbers = true
